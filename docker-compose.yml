version: '3.8'

services:
  stellar-standalone:
    image: stellar/quickstart:testing
    container_name: ai-net-stellar-standalone
    ports:
      - "8000:8000"
      - "11626:11626"
    command: --standalone --enable-soroban-rpc
    environment:
      - STELLAR_NETWORK=standalone
      - ENABLE_SOROBAN_RPC=true
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/ | grep -q 'Stellar' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (hardened) ──────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: ai-net-redis
    # Password auth + AOF persistence + RDB snapshots + noeviction policy
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme_in_production}
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory-policy noeviction
      --loglevel notice
      --protected-mode yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_in_production}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis daily backup sidecar ────────────────────────────────────────────
  redis-backup:
    image: redis:7.4-alpine
    container_name: ai-net-redis-backup
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - redis_data:/data:ro
      - redis_backups:/backups
    # Runs once per day; copies dump.rdb and prunes backups older than 7 days
    entrypoint: >
      sh -c '
        while true; do
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
          cp /data/dump.rdb /backups/dump_$${TIMESTAMP}.rdb 2>/dev/null && \
            echo "Backup OK: dump_$${TIMESTAMP}.rdb" || \
            echo "Backup WARN: dump.rdb not yet written (Redis may not have flushed)"
          # Retain last 7 backups
          ls -t /backups/dump_*.rdb 2>/dev/null | tail -n +8 | xargs rm -f 2>/dev/null || true
          sleep 86400
        done
      '
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-net-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=sqlite:///app/data/ai_net.db
      - SOROBAN_RPC_URL=http://stellar-standalone:8000/soroban/rpc
      - STELLAR_HORIZON_URL=http://stellar-standalone:8000
      - VENICE_API_KEY=${VENICE_API_KEY:-mock_local_key}
      - SKIP_STELLAR_ACCOUNT_VERIFY=true
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379
      - CACHE_DRIVER=redis
    volumes:
      - sqlite_data:/app/data
    depends_on:
      stellar-standalone:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai-net-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:3000
      - VITE_STELLAR_NETWORK=standalone
      - VITE_SOROBAN_RPC_URL=http://localhost:8000/soroban/rpc
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite_data:
    driver: local
  redis_data:
    driver: local
  redis_backups:
    driver: local
